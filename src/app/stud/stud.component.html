<!--- Modal starts here --><!--- ****************************************** -->
<div class="container">
<ng-template #studContent let-c="close" let-d="dismiss">

  <div class="bg-info">
      <div class="modal-header">
        <h4 class="modal-title">Student Info</h4>
        <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
  </div>
  <div class="modal-body">
  <div class="col-md-5">
      <div class="form-group">
          <label>Student No:</label>
          <input type="text" class="form-control"   [(ngModel)]="studobj.studentNumber">
      </div>
  </div>

  <div class="col-md-5">
      <div class="form-group">
          <label>Student Name:</label>
          <input type="text" class="form-control"  [(ngModel)]="studobj.studentName">
      </div>
  </div>

  <div class="col-md-5">
      <div class="form-group">
          <label>Student Age:</label>
          <input type="text" class="form-control"  [(ngModel)]="studobj.studentAge">
      </div>
  </div>
  <!--------------------------------------------------------------------------------->
        <div *ngFor="let player of fixPlayerNames; index as i">
          <input type="checkbox" [(ngModel)]="bool[i]"> {{player}}
      </div>

      <div *ngFor="let gender of genders; index as i">
        <input type="radio" [(ngModel)]="gen" [value]="genderValues[i]"> {{gender}}
     </div>

     <select [(ngModel)]="city" >
      <option *ngFor="let city of cities" [value]="city">{{city}}</option>
  </select>




  <div class="modal-footer" >
              <button type="button" class="btn btn-success" (click)="c('Close click'); save()">Save</button>
  </div>
</div>
</ng-template>
</div>
<!--- ****************************************** -->
<!--- Modal ends here -->
<div class="row justify-content-center">
  <div class="col-sm-2">
    <button class="btn btn-outline-primary" (click)="openPopUp(studContent); add()" >Add New Student</button>
  </div>
</div>

<div class="container">
  <div class="col-lg-12">
<table border="1" align="center">
  <!-- <tr>
    <th>Student No</th>
    <th>Student Name</th>
    <th>Student Age</th>
    <th>Update</th>
    <th>Delete</th>
  </tr> -->
  <tr *ngFor="let stud of studentList">
    <td>{{stud.studentNumber}}</td>
    <td>{{stud.studentName}}</td>
    <td>{{stud.studentAge}}</td>
    <td> <button (click)="update(stud);openPopUp(studContent);">Update</button> </td>
    <td> <button (click)="delete(stud.studentNumber)">Delete</button> </td>
  </tr>

</table>

<mat-form-field>
  <input matInput (keyup)="applyFilter($any($event.target).value)" placeholder="Filter">
</mat-form-field>

 <div class="mat-elevation-z8">
 <table mat-table [dataSource]="dataSource">

 <!-- studentNumber Column -->
 <ng-container matColumnDef="studentNumber">
 <th mat-header-cell *matHeaderCellDef> Student Number </th>
 <td mat-cell *matCellDef="let element"> {{element.studentNumber}} </td>
 </ng-container>

 <!--studentName Column -->
 <ng-container matColumnDef="studentName">
 <th mat-header-cell *matHeaderCellDef> Student Name </th>
 <td mat-cell *matCellDef="let element"> {{element.studentName}} </td>
 </ng-container>

 <!-- studentAge Column -->
 <ng-container matColumnDef="studentAge">
 <th mat-header-cell *matHeaderCellDef> Student Age </th>
 <td mat-cell *matCellDef="let element"> {{element.studentAge}} </td>
 </ng-container>

 <!-- Update Column -->
 <ng-container matColumnDef="update">
 <th mat-header-cell *matHeaderCellDef> Update </th>
 <td mat-cell *matCellDef="let element"><button (click)="update(element);openPopUp(studContent)">Update</button></td>
 <!--<td mat-cell *matCellDef="let element"> {{element.studentAge}} </td> -->
 </ng-container>

 <!-- Update Column -->
 <ng-container matColumnDef="delete">
 <th mat-header-cell *matHeaderCellDef> Delete </th>
 <td mat-cell *matCellDef="let element"><button (click)="delete(element.studentNumber)">Delete</button></td>
 <!--<td mat-cell *matCellDef="let element"> {{element.studentAge}} </td> -->
 </ng-container>

 <!-- Image -->
 <ng-container matColumnDef="img">
 <th mat-header-cell *matHeaderCellDef></th>
 <td mat-cell *matCellDef="let element"><img src="/assets/photos/One.jpg" width="30" height="30"></td>
 </ng-container>


 <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
 <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
 </table>

 <mat-paginator [pageSizeOptions]="[5, 10, 20, 25]" showFirstLastButtons></mat-paginator>
 </div>
</div>
</div>
